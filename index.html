<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Snake News</title>
<style>
    :root {
        --primary-color: #00f2fe;
        --secondary-color: #4facfe;
        --bg-dark: #0f172a;
        --card-bg: #1e293b;
        --text-color: #f8fafc;
        --danger-color: #ef4444;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
    }

    body {
        background-color: var(--bg-dark);
        color: var(--text-color);
        min-height: 100vh;
        padding-bottom: 80px;
    }

    /* Шапка сайта */
    header {
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 1.5rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .auth-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .btn {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: #000;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
    }

    .btn:active { transform: scale(0.95); }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-danger { background: var(--danger-color); color: #fff; }

    .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
    }

    /* Контент новостей */
    .container {
        max-width: 800px;
        margin: 20px auto;
        padding: 0 15px;
    }

    .news-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .news-card {
        background: var(--card-bg);
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        cursor: pointer;
        transition: transform 0.2s;
    }

    .news-card:hover { transform: translateY(-3px); }

    .news-img {
        width: 100%;
        max-height: 400px;
        object-fit: cover;
        display: block;
    }

    .news-content {
        padding: 20px;
    }

    .news-title {
        font-size: 1.3rem;
        margin-bottom: 10px;
        color: #fff;
    }

    .news-text {
        color: #94a3b8;
        line-height: 1.5;
        white-space: pre-wrap;
    }

    .news-date {
        font-size: 0.75rem;
        color: #64748b;
        margin-top: 15px;
    }

    /* Кнопка плюсик для создания */
    .add-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: #000;
        font-size: 32px;
        border: none;
        box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
        cursor: pointer;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 90;
    }

    /* Модальные окна */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(5px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 200;
        padding: 15px;
    }

    .modal-box {
        background: var(--card-bg);
        padding: 25px;
        border-radius: 20px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title {
        font-size: 1.3rem;
        margin-bottom: 15px;
        text-align: center;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 0.85rem;
        color: #94a3b8;
    }

    .form-control {
        width: 100%;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #fff;
        outline: none;
    }

    .form-control:focus {
        border-color: var(--primary-color);
    }

    textarea.form-control {
        resize: vertical;
        min-height: 100px;
    }

    .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 20px;
    }

    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }
    .tab {
        flex: 1;
        padding: 8px;
        text-align: center;
        background: #0f172a;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
    }
    .tab.active {
        background: var(--secondary-color);
        color: #000;
        font-weight: 700;
    }

    .error-msg {
        color: var(--danger-color);
        font-size: 0.85rem;
        margin-top: 5px;
        text-align: center;
    }
</style>
</head>
<body>

<header>
    <div class="logo">🐍 Super Snake News</div>
    <div class="auth-buttons" id="auth-section">
        <!-- Заполняется динамически -->
    </div>
</header>

<div class="container">
    <div class="news-grid" id="news-container">
        <!-- Новости будут добавляться сюда -->
    </div>
</div>

<!-- Плавающая кнопка для добавления объявлений -->
<button class="add-btn" id="open-add-modal-btn" title="Создать новость">+</button>

<!-- Модальное окно Входа / Регистрации -->
<div class="modal-overlay" id="auth-modal">
    <div class="modal-box">
        <div class="tabs">
            <div class="tab active" id="tab-login">Вход</div>
            <div class="tab" id="tab-register">Регистрация</div>
        </div>
        
        <form id="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="auth-email" class="form-control" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Пароль (только латинские буквы, 5–18 символов)</label>
                <input type="password" id="auth-pass" class="form-control" placeholder="••••••••" required>
            </div>
            <div id="auth-error" class="error-msg"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModals()">Отмена</button>
                <button type="submit" class="btn" id="auth-submit-btn">Войти</button>
            </div>
        </form>
    </div>
</div>

<!-- Модальное окно Добавления новости -->
<div class="modal-overlay" id="add-news-modal">
    <div class="modal-box">
        <h3 class="modal-title">Новая публикация</h3>
        <form id="add-news-form">
            <div class="form-group">
                <label>Заголовок новости *</label>
                <input type="text" id="news-title-input" class="form-control" required placeholder="Введите заголовок">
            </div>
            <div class="form-group">
                <label>Текст новости *</label>
                <textarea id="news-text-input" class="form-control" required placeholder="Напишите текст..."></textarea>
            </div>
            <div class="form-group">
                <label>Прикрепить фото (необязательно)</label>
                <input type="file" id="news-img-input" class="form-control" accept="image/*">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModals()">Отмена</button>
                <button type="submit" class="btn">Опубликовать</button>
            </div>
        </form>
    </div>
</div>

<!-- Меню управления объявлением (Удалить / Отмена) -->
<div class="modal-overlay" id="action-modal">
    <div class="modal-box" style="text-align: center;">
        <h3 class="modal-title">Управление новостью</h3>
        <p style="color: #94a3b8; margin-bottom: 20px;">Вы хотите удалить это объявление?</p>
        <div class="modal-actions" style="justify-content: center;">
            <button class="btn btn-secondary" onclick="closeModals()">Отмена</button>
            <button class="btn btn-danger" id="confirm-delete-btn">Удалить</button>
        </div>
    </div>
</div>

<script>
// --- ИНИЦИАЛИЗАЦИЯ ДАННЫХ И ХРАНИЛИЩА ---

const PRESET_USER = {
    email: "SuperSnakeNews@gmail.com",
    pass: "Admin_Razr#2099" // Новый пароль администратора
};

// Загружаем пользователей и обновляем данные администратора при запуске
let users = JSON.parse(localStorage.getItem('ssn_users')) || [];
const adminIndex = users.findIndex(u => u.email.toLowerCase() === PRESET_USER.email.toLowerCase());

if (adminIndex !== -1) {
    users[adminIndex] = PRESET_USER;
} else {
    users.push(PRESET_USER);
}
localStorage.setItem('ssn_users', JSON.stringify(users));

// Загружаем текущего пользователя
let currentUser = JSON.parse(localStorage.getItem('ssn_current_user')) || null;

// Загружаем новости
let newsList = JSON.parse(localStorage.getItem('ssn_news')) || [
    {
        id: 1,
        title: "Добро пожаловать в Super Snake News!",
        text: "Это главный новостной портал.",
        image: null,
        date: "13.09.2026, 12:00"
    }
];

let selectedNewsId = null;
let isLoginMode = true;

// --- ЭЛЕМЕНТЫ DOM ---
const authSection = document.getElementById('auth-section');
const addBtn = document.getElementById('open-add-modal-btn');
const newsContainer = document.getElementById('news-container');

const authModal = document.getElementById('auth-modal');
const authForm = document.getElementById('auth-form');
const authEmail = document.getElementById('auth-email');
const authPass = document.getElementById('auth-pass');
const authError = document.getElementById('auth-error');
const tabLogin = document.getElementById('tab-login');
const tabRegister = document.getElementById('tab-register');
const authSubmitBtn = document.getElementById('auth-submit-btn');

const addNewsModal = document.getElementById('add-news-modal');
const addNewsForm = document.getElementById('add-news-form');
const actionModal = document.getElementById('action-modal');
const confirmDeleteBtn = document.getElementById('confirm-delete-btn');

// --- ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ---

function updateUI() {
    // Авторизация в шапке
    if (currentUser) {
        authSection.innerHTML = `
            <div class="user-info">
                <button class="btn btn-secondary" onclick="logout()">Выход</button>
            </div>
        `;
        
        // Плюсик показывается ТОЛЬКО для админа
        const isAdmin = currentUser.email.toLowerCase() === PRESET_USER.email.toLowerCase() && 
                        currentUser.pass === PRESET_USER.pass;

        if (isAdmin) {
            addBtn.style.display = 'flex';
        } else {
            addBtn.style.display = 'none';
        }
    } else {
        authSection.innerHTML = `
            <button class="btn" onclick="openAuthModal()">Войти</button>
        `;
        addBtn.style.display = 'none';
    }

    // Рендер новостей
    newsContainer.innerHTML = '';
    newsList.forEach(news => {
        const card = document.createElement('div');
        card.className = 'news-card';
        
        // Только админ может удалять новости
        if (currentUser && currentUser.email.toLowerCase() === PRESET_USER.email.toLowerCase() && currentUser.pass === PRESET_USER.pass) {
            card.onclick = () => openActionModal(news.id);
        }

        let imgHTML = news.image ? `<img src="${news.image}" class="news-img" alt="Фото новости">` : '';

        card.innerHTML = `
            ${imgHTML}
            <div class="news-content">
                <h2 class="news-title">${escapeHtml(news.title)}</h2>
                <p class="news-text">${escapeHtml(news.text)}</p>
                <div class="news-date">Опубликовано: ${news.date}</div>
            </div>
        `;
        newsContainer.appendChild(card);
    });
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// --- АВТОРИЗАЦИЯ И РЕГИСТРАЦИЯ ---

function openAuthModal() {
    authModal.style.display = 'flex';
    setAuthMode(true);
}

function setAuthMode(isLogin) {
    isLoginMode = isLogin;
    authError.textContent = '';
    if (isLogin) {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        authSubmitBtn.textContent = 'Войти';
    } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        authSubmitBtn.textContent = 'Зарегистрироваться';
    }
}

tabLogin.onclick = () => setAuthMode(true);
tabRegister.onclick = () => setAuthMode(false);

authForm.onsubmit = (e) => {
    e.preventDefault();
    const email = authEmail.value.trim();
    const pass = authPass.value.trim();

    // Проверка на админский Email
    const isAdminEmail = email.toLowerCase() === PRESET_USER.email.toLowerCase();

    // Проверка пароля регулярным выражением отключается для аккаунта админа
    if (!isAdminEmail) {
        const passRegex = /^[a-zA-Z]{5,18}$/;
        if (!passRegex.test(pass)) {
            authError.textContent = 'Пароль должен содержать от 5 до 18 латинских букв без цифр и пробелов!';
            return;
        }
    }

    if (isLoginMode) {
        const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.pass === pass);
        if (user) {
            currentUser = user;
            localStorage.setItem('ssn_current_user', JSON.stringify(currentUser));
            closeModals();
            updateUI();
        } else {
            authError.textContent = 'Неверный Email или пароль!';
        }
    } else {
        if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
            authError.textContent = 'Этот Email уже зарегистрирован!';
            return;
        }
        const newUser = { email, pass };
        users.push(newUser);
        localStorage.setItem('ssn_users', JSON.stringify(users));
        currentUser = newUser;
        localStorage.setItem('ssn_current_user', JSON.stringify(currentUser));
        closeModals();
        updateUI();
    }
};

function logout() {
    currentUser = null;
    localStorage.removeItem('ssn_current_user');
    updateUI();
}

// --- СОЗДАНИЕ НОВОСТЕЙ ---

document.getElementById('open-add-modal-btn').onclick = () => {
    addNewsModal.style.display = 'flex';
};

addNewsForm.onsubmit = (e) => {
    e.preventDefault();
    const title = document.getElementById('news-title-input').value.trim();
    const text = document.getElementById('news-text-input').value.trim();
    const fileInput = document.getElementById('news-img-input');
    const file = fileInput.files[0];

    const createNews = (imageData = null) => {
        const newNews = {
            id: Date.now(),
            title: title,
            text: text,
            image: imageData,
            date: new Date().toLocaleString('ru-RU')
        };

        newsList.unshift(newNews);
        localStorage.setItem('ssn_news', JSON.stringify(newsList));
        addNewsForm.reset();
        closeModals();
        updateUI();
    };

    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            createNews(e.target.result);
        };
        reader.readAsDataURL(file);
    } else {
        createNews(null);
    }
};

// --- МЕНЮ ДЕЙСТВИЙ (УДАЛЕНИЕ / ОТМЕНА) ---

function openActionModal(id) {
    if (!currentUser) return; 
    selectedNewsId = id;
    actionModal.style.display = 'flex';
}

confirmDeleteBtn.onclick = () => {
    if (selectedNewsId) {
        newsList = newsList.filter(n => n.id !== selectedNewsId);
        localStorage.setItem('ssn_news', JSON.stringify(newsList));
        closeModals();
        updateUI();
    }
};

// --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---

function closeModals() {
    authModal.style.display = 'none';
    addNewsModal.style.display = 'none';
    actionModal.style.display = 'none';
    authForm.reset();
    authError.textContent = '';
    selectedNewsId = null;
}

// Первоначальный рендер
updateUI();
</script>
</body>
</html>
